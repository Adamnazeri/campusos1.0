<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="CampusOS banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#dots)"/>
  <circle cx="200" cy="60" r="90" fill="#60a5fa" fill-opacity="0.45" filter="url(#blur)">
    <animate attributeName="cx" values="200;420;200" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="220" r="110" fill="#a78bfa" fill-opacity="0.40" filter="url(#blur)">
    <animate attributeName="cx" values="1000;780;1000" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g>
    <polygon points="600,26 646,46 600,66 554,46" fill="#ffffff"/>
    <path d="M576 58 v16 q24 14 48 0 v-16 l-24 10z" fill="#93c5fd"/>
    <path d="M646 46 v26" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="646" cy="76" r="4" fill="#fbbf24"/>
  </g>
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="2">CampusOS</text>
  <text x="600" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#dbeafe">Enterprise-Grade School &amp; Campus Management Operating System</text>
  <rect x="520" y="216" width="160" height="4" rx="2" fill="#60a5fa" fill-opacity="0.9">
    <animate attributeName="width" values="40;160;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="580;520;580" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
